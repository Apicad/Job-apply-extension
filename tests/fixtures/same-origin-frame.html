<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open roles | Careers at Menabrea Analytics</title>
    <script>
      // Test hook, identical on every fixture page. Tests read window.__fixture to prove what the
      // extension did and did not touch: events holds every input, change, focus, blur, focusin,
      // focusout, click and keydown event that reaches the document, messages every window message.
      window.__fixture = { events: [], messages: [] };
      (function () {
        var fixture = window.__fixture;
        var entries = new WeakMap();
        function attribute(node, name) {
          // through the prototype: a form answers form.id and form.name with its own controls
          try {
            return Element.prototype.getAttribute.call(node, name) || '';
          } catch (error) {
            return '';
          }
        }
        function record(event) {
          var path = typeof event.composedPath === 'function' ? event.composedPath() : [];
          var target = path.length > 0 ? path[0] : event.target;
          var entry = entries.get(event);
          if (entry === undefined) {
            entry = { type: event.type, id: '', name: '', trusted: event.isTrusted };
            entries.set(event, entry);
            fixture.events.push(entry);
          }
          entry.id = attribute(target, 'id');
          entry.name = attribute(target, 'name');
        }
        function watch(root) {
          ['input', 'change', 'focus', 'blur', 'focusin', 'focusout', 'click', 'keydown'].forEach(function (type) {
            root.addEventListener(type, record, true);
          });
        }
        watch(document);
        // Not enumerable, so the object still reads { events, messages }. Pages with shadow roots call
        // it for each root: a change event does not leave a shadow tree, so the document never sees it.
        Object.defineProperty(fixture, 'watch', { value: watch });
        window.addEventListener('message', function (event) {
          fixture.messages.push(event.data);
        });
      })();
    </script>
    <style>
      body {
        margin: 0;
        font: 16px/1.5 system-ui, sans-serif;
        color: #20262e;
        background: #fff;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      /* A chat window that has not been opened yet: kept in the page, but hidden. */
      .popup {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        width: 340px;
        height: 460px;
        visibility: hidden;
        opacity: 0;
      }
      .popup iframe {
        width: 100%;
        height: 100%;
        border: 1px solid #cdd3db;
        border-radius: 8px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Open roles</h1>
      <p>
        A company careers page that anyone can see, with no form of its own. This is a test fixture;
        the company is made up.
      </p>
      <ul>
        <li>Notes Translator (Engineering)</li>
        <li>Table Checker</li>
      </ul>
    </main>

    <!-- A chat widget's "before we start" form: name, e-mail and phone, in a frame of the page's
         own origin (srcdoc), waiting inside a wrapper that is visibility:hidden and opacity:0
         until somebody opens the chat. The frame itself has no hiding style at all, and from
         inside it the three fields look like any visible form: they would even pass for an
         application. A script injected into every frame runs in this one too. Nothing may be
         written here: the page that embeds the frame hides it. -->
    <div id="chat-popup" class="popup">
      <iframe
        id="chat-frame"
        title="Chat with us"
        srcdoc="<!doctype html>
<html lang='en'>
  <head>
    <meta charset='utf-8'>
    <title>Chat with us</title>
    <script>
      // The same test hook as on every fixture page, for this frame's own document.
      window.__fixture = { events: [], messages: [] };
      (function () {
        var fixture = window.__fixture;
        var entries = new WeakMap();
        function attribute(node, name) {
          try {
            return Element.prototype.getAttribute.call(node, name) || '';
          } catch (error) {
            return '';
          }
        }
        function record(event) {
          var path = typeof event.composedPath === 'function' ? event.composedPath() : [];
          var target = path.length > 0 ? path[0] : event.target;
          var entry = entries.get(event);
          if (entry === undefined) {
            entry = { type: event.type, id: '', name: '', trusted: event.isTrusted };
            entries.set(event, entry);
            fixture.events.push(entry);
          }
          entry.id = attribute(target, 'id');
          entry.name = attribute(target, 'name');
        }
        function watch(root) {
          ['input', 'change', 'focus', 'blur', 'focusin', 'focusout', 'click', 'keydown'].forEach(function (type) {
            root.addEventListener(type, record, true);
          });
        }
        watch(document);
        Object.defineProperty(fixture, 'watch', { value: watch });
        window.addEventListener('message', function (event) {
          fixture.messages.push(event.data);
        });
        document.addEventListener('submit', function (event) {
          event.preventDefault();
          fixture.submitted = true;
        });
      })();
    </script>
    <style>
      body { margin: 12px; font: 14px/1.4 system-ui, sans-serif; }
      label { display: block; margin-top: 8px; font-weight: 600; }
      input { box-sizing: border-box; width: 100%; padding: 6px 8px; font: inherit; }
      button { margin-top: 12px; padding: 6px 12px; font: inherit; }
    </style>
  </head>
  <body>
    <h2>Before we start</h2>
    <form id='pre-chat' action='/same-origin-frame.html' method='post'>
      <label for='chat-name'>Full name</label>
      <input type='text' id='chat-name' name='name' autocomplete='name'>
      <label for='chat-email'>Email</label>
      <input type='email' id='chat-email' name='email' autocomplete='email'>
      <label for='chat-phone'>Phone</label>
      <input type='tel' id='chat-phone' name='phone' autocomplete='tel'>
      <button type='submit'>Start chat</button>
    </form>
  </body>
</html>"
      ></iframe>
    </div>
  </body>
</html>
