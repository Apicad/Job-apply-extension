<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apply: Table Checker | Menabrea Analytics</title>
    <script>
      // Test hook, identical on every fixture page. Tests read window.__fixture to prove what the
      // extension did and did not touch: events holds every input, change, focus, blur, focusin,
      // focusout, click and keydown event that reaches the document, messages every window message.
      window.__fixture = { events: [], messages: [] };
      (function () {
        var fixture = window.__fixture;
        var entries = new WeakMap();
        function attribute(node, name) {
          // through the prototype: a form answers form.id and form.name with its own controls
          try {
            return Element.prototype.getAttribute.call(node, name) || '';
          } catch (error) {
            return '';
          }
        }
        function record(event) {
          var path = typeof event.composedPath === 'function' ? event.composedPath() : [];
          var target = path.length > 0 ? path[0] : event.target;
          var entry = entries.get(event);
          if (entry === undefined) {
            entry = { type: event.type, id: '', name: '', trusted: event.isTrusted };
            entries.set(event, entry);
            fixture.events.push(entry);
          }
          entry.id = attribute(target, 'id');
          entry.name = attribute(target, 'name');
        }
        function watch(root) {
          ['input', 'change', 'focus', 'blur', 'focusin', 'focusout', 'click', 'keydown'].forEach(function (type) {
            root.addEventListener(type, record, true);
          });
        }
        watch(document);
        // Not enumerable, so the object still reads { events, messages }. Pages with shadow roots call
        // it for each root: a change event does not leave a shadow tree, so the document never sees it.
        Object.defineProperty(fixture, 'watch', { value: watch });
        window.addEventListener('message', function (event) {
          fixture.messages.push(event.data);
        });
      })();
    </script>
    <style>
      body {
        margin: 0;
        font: 16px/1.5 system-ui, sans-serif;
        color: #20262e;
        background: #fff;
      }
      main {
        max-width: 38rem;
        margin: 0 auto;
        padding: 2rem 1rem 4rem;
      }
      application-card,
      job-alerts {
        display: block;
        margin-bottom: 2rem;
        padding: 1.25rem;
        border: 1px solid #cdd3db;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Table Checker</h1>
      <p>
        Both boxes below are web components: what you see inside each of them lives in a shadow
        tree, not in the page's own document. This is a test fixture; the company, the job and
        every person here are made up.
      </p>

      <!-- A custom element with an OPEN shadow root. The application form (first name, last
           name, e-mail and phone, each with a label[for]) is inside that root:
           document.querySelector finds none of it, document.getElementById('first-name') is
           null, and the ids its labels point to exist only within the shadow tree. An open root
           is walked like the page itself. -->
      <application-card id="open-host"></application-card>

      <!-- A custom element with a CLOSED shadow root holding one e-mail box. Its host has no
           shadowRoot property. A closed root is the component saying "keep out": it is never
           entered, even where the browser would let an extension in. -->
      <job-alerts id="closed-host"></job-alerts>
    </main>

    <!-- What goes into the open root. -->
    <template id="application-card-template">
      <style>
        .row {
          display: flex;
          flex-direction: column;
          gap: 0.25rem;
          margin-bottom: 0.9rem;
        }
        label {
          font-weight: 600;
        }
        input {
          box-sizing: border-box;
          width: 100%;
          padding: 0.5rem 0.65rem;
          border: 1px solid #aeb6c1;
          border-radius: 4px;
          font: inherit;
        }
        button {
          padding: 0.5rem 1.1rem;
          font: inherit;
        }
      </style>
      <h2>Your application</h2>
      <form id="shadow-application" action="/shadow.html" method="post">
        <div class="row">
          <label for="first-name">First name</label>
          <input type="text" id="first-name" name="first_name" autocomplete="given-name" />
        </div>
        <div class="row">
          <label for="last-name">Last name</label>
          <input type="text" id="last-name" name="last_name" autocomplete="family-name" />
        </div>
        <div class="row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" />
        </div>
        <!-- A fourth field, so that the form counts as an application however "a name plus
             e-mail plus one more recognised kind" is read: first and last name are one name. -->
        <div class="row">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" />
        </div>
        <button type="submit">Send application</button>
      </form>
    </template>

    <!-- What goes into the closed root. -->
    <template id="job-alerts-template">
      <style>
        label {
          display: block;
          font-weight: 600;
        }
        input {
          box-sizing: border-box;
          width: 100%;
          margin: 0.25rem 0 0.9rem;
          padding: 0.5rem 0.65rem;
          border: 1px solid #aeb6c1;
          border-radius: 4px;
          font: inherit;
        }
        button {
          padding: 0.5rem 1.1rem;
          font: inherit;
        }
      </style>
      <h2>Tell me about new jobs</h2>
      <form id="closed-form" action="/shadow.html" method="post">
        <label for="closed-email">Email</label>
        <input type="email" id="closed-email" name="email" autocomplete="email" />
        <button type="submit">Notify me</button>
      </form>
    </template>

    <script>
      (function () {
        var fixture = window.__fixture;
        var closedRoot = null;

        function build(host, templateId, mode) {
          var root = host.attachShadow({ mode: mode });
          root.appendChild(document.getElementById(templateId).content.cloneNode(true));
          // Events are recorded inside each root as well, under the id of the control they
          // really happened on. One event still makes one entry in window.__fixture.events.
          fixture.watch(root);
          // Nothing is ever sent anywhere: a submit only leaves a mark for the tests.
          root.addEventListener('submit', function (event) {
            event.preventDefault();
            fixture.submitted = true;
          });
          return root;
        }

        customElements.define(
          'application-card',
          class extends HTMLElement {
            constructor() {
              super();
              build(this, 'application-card-template', 'open');
            }
          },
        );
        customElements.define(
          'job-alerts',
          class extends HTMLElement {
            constructor() {
              super();
              closedRoot = build(this, 'job-alerts-template', 'closed');
            }
          },
        );

        // For tests only: page scripts and Playwright cannot look into a closed root, so the
        // fixture hands out the one thing a test has to know. Not enumerable, like watch.
        Object.defineProperty(fixture, 'closedEmail', {
          value: function () {
            return closedRoot === null ? null : closedRoot.getElementById('closed-email').value;
          },
        });
      })();
    </script>
  </body>
</html>
