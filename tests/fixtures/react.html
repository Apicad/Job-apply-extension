<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apply: Loom Programmer | Byron Mills</title>
    <script>
      // Test hook, identical on every fixture page. Tests read window.__fixture to prove what the
      // extension did and did not touch: events holds every input, change, focus, blur, focusin,
      // focusout, click and keydown event that reaches the document, messages every window message.
      window.__fixture = { events: [], messages: [] };
      (function () {
        var fixture = window.__fixture;
        var entries = new WeakMap();
        function attribute(node, name) {
          // through the prototype: a form answers form.id and form.name with its own controls
          try {
            return Element.prototype.getAttribute.call(node, name) || '';
          } catch (error) {
            return '';
          }
        }
        function record(event) {
          var path = typeof event.composedPath === 'function' ? event.composedPath() : [];
          var target = path.length > 0 ? path[0] : event.target;
          var entry = entries.get(event);
          if (entry === undefined) {
            entry = { type: event.type, id: '', name: '', trusted: event.isTrusted };
            entries.set(event, entry);
            fixture.events.push(entry);
          }
          entry.id = attribute(target, 'id');
          entry.name = attribute(target, 'name');
        }
        function watch(root) {
          ['input', 'change', 'focus', 'blur', 'focusin', 'focusout', 'click', 'keydown'].forEach(function (type) {
            root.addEventListener(type, record, true);
          });
        }
        watch(document);
        // Not enumerable, so the object still reads { events, messages }. Pages with shadow roots call
        // it for each root: a change event does not leave a shadow tree, so the document never sees it.
        Object.defineProperty(fixture, 'watch', { value: watch });
        window.addEventListener('message', function (event) {
          fixture.messages.push(event.data);
        });
      })();
    </script>
    <style>
      body {
        margin: 0;
        font: 16px/1.5 system-ui, sans-serif;
        color: #20262e;
        background: #fff;
      }
      main {
        max-width: 38rem;
        margin: 0 auto;
        padding: 2rem 1rem 4rem;
      }
      .row {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        margin-bottom: 0.9rem;
      }
      label,
      legend {
        font-weight: 600;
      }
      .row input,
      .row select {
        box-sizing: border-box;
        width: 100%;
        padding: 0.5rem 0.65rem;
        border: 1px solid #aeb6c1;
        border-radius: 4px;
        background: #fff;
        font: inherit;
      }
      .row [aria-invalid='true'] {
        border-color: #b3261e;
      }
      fieldset {
        margin: 0 0 0.9rem;
        padding: 0.75rem 1rem;
        border: 1px solid #cdd3db;
        border-radius: 6px;
      }
      fieldset label {
        display: inline-flex;
        gap: 0.4rem;
        align-items: center;
        margin-right: 1.25rem;
        font-weight: 400;
      }
      .error {
        margin: 0;
        color: #b3261e;
        font-size: 0.875rem;
      }
      button {
        padding: 0.5rem 1.1rem;
        border: 1px solid #20262e;
        border-radius: 4px;
        background: #20262e;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      #state {
        margin-top: 2rem;
        padding: 1rem;
        border-radius: 6px;
        background: #f1f3f6;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Loom Programmer</h1>
      <p>
        Byron Mills weaves cloth to order. This page is a test fixture: the form below is a real
        React 19 form (see react-form.jsx), drawn after the page has loaded. The company, the job
        and every person here are made up.
      </p>
      <!-- React draws the form into this element. Every control in it is "controlled": what it
           shows comes from the component's state, and a value that React did not hear about is
           thrown away at the next render. -->
      <div id="root"></div>
    </main>
    <script type="module" src="/react-form.jsx"></script>
  </body>
</html>
