<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture pages</title>
    <style>
      body {
        font: 16px/1.5 system-ui, sans-serif;
        max-width: 40rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Fixture pages</h1>
    <p>
      Local stand-ins for real job application forms, used by the end-to-end tests. Everyone on these pages is
      made up. Serve them with <code>npm run fixtures</code> and open the extension on any of them to try it
      by hand.
    </p>
    <ul id="pages"></ul>
    <script type="module">
      // Lists every other .html file in this folder.
      const pages = Object.keys(import.meta.glob('./*.html')).filter((p) => p !== './index.html');
      const list = document.querySelector('#pages');
      for (const page of pages.sort()) {
        const item = document.createElement('li');
        const link = document.createElement('a');
        link.href = page;
        link.textContent = page.replace('./', '');
        item.append(link);
        list.append(item);
      }
    </script>
  </body>
</html>
