<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Job Application for Software Engineering Intern at Fictional Datastore</title>
  <style>
    body { font: 16px system-ui; margin: 2rem auto; max-width: 42rem; }
    label, .select__container, .file-upload, .education--form { display: block; margin: 1rem 0; }
    input { font: inherit; padding: .5rem; }
    .select__control { border: 1px solid #777; padding: .5rem; }
    .select__input { border: 0; min-width: 12rem; }
    .select__single-value { display: inline; }
    .select__menu-portal { position: fixed; inset: 8rem 2rem auto; background: white; border: 1px solid #777; z-index: 10; }
    [role="option"] { padding: .5rem; cursor: pointer; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <h1>Software Engineering Intern</h1>
  <p>Fictional Datastore — synthetic Greenhouse interaction fixture.</p>
  <form id="application-form" class="application--form">
    <label>First Name<input id="first_name" autocomplete="given-name" /></label>
    <label>Last Name<input id="last_name" autocomplete="family-name" /></label>
    <label>Email<input id="email" type="email" autocomplete="email" /></label>
    <fieldset class="phone-input"><legend>Phone</legend><div id="country-slot"></div><label>Phone<input id="phone" type="tel" /></label></fieldset>
    <div id="location-slot"></div>
    <div role="group" aria-labelledby="upload-label-resume" class="file-upload">
      <div id="upload-label-resume">Resume/CV*</div>
      <div class="file-upload__wrapper"><button type="button" id="attach-resume">Attach</button><label for="resume" class="visually-hidden">Attach</label><input id="resume" type="file" class="visually-hidden" accept=".pdf,.doc,.docx,.txt,.rtf" /></div>
    </div>
    <div role="group" aria-labelledby="transcript-label" class="file-upload">
      <div id="transcript-label">Please provide a recent transcript of your undergraduate studies*</div>
      <label for="transcript">Attach transcript</label><input id="transcript" type="file" accept=".pdf,.txt" />
    </div>
    <div class="education--container"><div class="education--form"><h2>Education</h2><div id="education-slots"></div><label>End date year<input id="end-date-year--0" type="number" min="1900" max="2100" /></label></div></div>
    <label>LinkedIn Profile<input id="linkedin" /></label>
    <div id="authorization-slot"></div>
    <label><input id="consent" type="checkbox" />I certify my application is accurate</label>
    <button id="submit-application" type="submit">Submit application</button>
  </form>
  <p id="submitted">Not submitted</p>
  <form id="unrelated-form"><label>School<input id="unrelated-school" /></label></form>
  <script>
    window.__fixture = { submitted: false, events: [], selections: [], uploads: 0 };
    const fixture = window.__fixture;
    const params = new URLSearchParams(location.search);
    for (const type of ['input', 'change', 'click', 'keydown']) document.addEventListener(type, event => fixture.events.push({ type, id: event.target.id }), true);
    document.querySelector('#application-form').addEventListener('submit', event => { event.preventDefault(); fixture.submitted = true; document.querySelector('#submitted').textContent = 'Submitted'; });
    document.querySelector('#phone').addEventListener('input', event => { event.target.value = event.target.value.replace(/[^0-9]/g, ''); });
    document.querySelector('#attach-resume').addEventListener('click', () => document.querySelector('#resume')?.click());
    document.querySelector('#resume').addEventListener('change', event => {
      const file = event.target.files[0]; if (!file) return;
      fixture.uploads++;
      const wrapper = event.target.closest('.file-upload__wrapper');
      wrapper.replaceChildren(Object.assign(document.createElement('progress'), { max: 100, value: 100 }));
      setTimeout(() => {
        const filename = document.createElement('span'); filename.textContent = file.name;
        const remove = document.createElement('button'); remove.type = 'button'; remove.setAttribute('aria-label', 'Remove file'); remove.textContent = '×';
        wrapper.replaceChildren(filename, remove);
      }, 350);
    });
    function combo(slot, id, label, choices, options = {}) {
      const widget = document.createElement('div'); widget.className = 'select__container';
      const labelNode = document.createElement('label'); labelNode.id = `${id}-label`; labelNode.htmlFor = id; labelNode.textContent = label;
      const control = document.createElement('div'); control.className = 'select__control';
      const values = document.createElement('div'); values.className = 'select__value-container';
      const placeholder = document.createElement('div'); placeholder.className = 'select__placeholder'; placeholder.id = `react-select-${id}-placeholder`; placeholder.textContent = 'Select...';
      const inputContainer = document.createElement('div'); inputContainer.className = 'select__input-container';
      const input = document.createElement('input'); input.id = id; input.className = 'select__input'; input.type = 'text'; input.autocomplete = 'off'; input.setAttribute('role', 'combobox'); input.setAttribute('aria-autocomplete', 'list'); input.setAttribute('aria-expanded', 'false'); input.setAttribute('aria-haspopup', 'true'); input.setAttribute('aria-labelledby', labelNode.id); input.setAttribute('aria-describedby', placeholder.id);
      const hidden = document.createElement('input'); hidden.type = 'hidden'; hidden.name = id;
      inputContainer.append(input); values.append(placeholder, inputContainer); control.append(values); widget.append(labelNode, control, hidden); document.querySelector(slot).append(widget);
      let menu, timer, revision = 0;
      const removeMenu = () => { revision++; clearTimeout(timer); menu?.remove(); menu = null; input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-controls'); };
      const select = (choice, record = true) => {
        removeMenu(); placeholder.remove(); values.querySelector('.select__single-value')?.remove();
        const selected = document.createElement('div'); selected.className = 'select__single-value'; selected.textContent = choice.display || choice.label; values.prepend(selected);
        hidden.value = choice.value; input.value = ''; widget.dataset.selected = choice.label;
        if (record) fixture.selections.push({ id, label: choice.label, value: choice.value });
      };
      const show = () => {
        clearTimeout(timer); const request = ++revision; menu?.remove(); menu = null; input.setAttribute('aria-expanded', 'true');
        const menuId = `react-select-${id}-listbox`; input.setAttribute('aria-controls', menuId);
        const search = input.value.toLowerCase();
        timer = setTimeout(() => {
          if (request !== revision) return;
          menu = document.createElement('div'); menu.id = menuId; menu.className = 'select__menu-portal'; menu.setAttribute('role', 'listbox');
          choices.filter(choice => !search || choice.label.toLowerCase().includes(search) || search.includes(choice.label.toLowerCase())).forEach((choice, index) => {
            const option = document.createElement('div'); option.id = `react-select-${id}-option-${index}`; option.className = 'select__option'; option.setAttribute('role', 'option'); option.setAttribute('aria-selected', 'false'); option.textContent = choice.label;
            option.addEventListener('mousedown', event => event.preventDefault()); option.addEventListener('click', () => select(choice)); menu.append(option);
          });
          document.body.append(menu);
        }, options.delay || 80);
      };
      input.addEventListener('input', show); input.addEventListener('focus', show); input.addEventListener('keydown', event => { if (event.key === 'ArrowDown') { event.preventDefault(); show(); } if (event.key === 'Escape') removeMenu(); });
      if (options.prefilled) select(options.prefilled, false);
      return widget;
    }
    const us = { label: 'United States +1', value: 'US', display: '+1' };
    const canada = { label: 'Canada +1', value: 'CA', display: '+1' };
    combo('#country-slot', 'country', 'Country', [us, canada], { prefilled: params.has('prefilledCountry') ? canada : null });
    combo('#location-slot', 'candidate-location', 'Location (City)', [{ label: 'San Francisco, California, United States', value: 'sf-ca-us' }, { label: 'San Francisco, Cordoba, Argentina', value: 'sf-ar' }], { delay: 300 });
    const school = { label: 'Example Community College', value: 'college-1' };
    combo('#education-slots', 'school--0', 'School', params.has('ambiguous') ? [school, { ...school, value: 'college-2' }] : [school, { label: 'Other', value: 'other' }]);
    combo('#education-slots', 'degree--0', 'Degree', [{ label: 'Associate of Science', value: 'AS' }, { label: 'Bachelor of Science', value: 'BS' }, { label: 'Other', value: 'other' }]);
    combo('#education-slots', 'discipline--0', 'Discipline', [{ label: 'Computer Science', value: 'CS' }, { label: 'Other', value: 'other' }]);
    combo('#education-slots', 'end-date-month--0', 'End date month', [{ label: 'May', value: '5' }, { label: 'June', value: '6' }, { label: 'July', value: '7' }]);
    combo('#authorization-slot', 'question_authorization', 'Are you legally authorized to work in the country in which you are applying?', [{ label: 'Yes', value: 'yes' }, { label: 'No', value: 'no' }]);
  </script>
</body>
</html>
