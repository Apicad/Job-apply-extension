<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sample developer application</title><style>body{font:17px/1.5 system-ui;max-width:760px;margin:40px auto;background:#f7f5ef;color:#243126}label{display:block;margin:15px 0}input,select,textarea{display:block;padding:10px;min-width:300px;font:inherit}textarea{width:95%;height:120px}input[type=checkbox]{display:inline;min-width:0}button{padding:12px;font:inherit}[hidden]{display:none!important}</style></head><body><small>SYNTHETIC SAMPLE · NOT A LIVE APPLICATION</small><h1>Junior developer</h1><p>Fictional Community Tools seeks someone to build small tools, write tests and document their work. These are job requirements, not applicant accomplishments.</p><form id="application"><label>First name<input id="first" autocomplete="given-name"></label><label>Last name<input id="last" autocomplete="family-name"></label><label>Email<input id="email" type="email"></label><label>Phone<input id="phone" type="tel"></label><label>Country<select id="country"><option value="">Select a country</option><option value="US">United States</option><option value="CA">Canada</option></select></label><label>Describe a relevant project.<textarea id="project" maxlength="1500"></textarea></label><label>Previously answered<input id="existing" value="Keep my answer"></label><label>Resume<input id="resume" type="file"></label><label>Location<input id="location" role="combobox" aria-autocomplete="list"></label><label>Signature<input id="signature"></label><label><input id="consent" type="checkbox">I certify my application is accurate</label><label hidden>First name<input id="hidden" hidden></label><button type="submit">Submit sample application manually</button></form><p id="submitted">Not submitted</p><script>window.events=[];for(const name of ['input','change','keydown','click'])document.addEventListener(name,e=>events.push({type:name,id:e.target.id}));document.querySelector('form').onsubmit=e=>{e.preventDefault();document.querySelector('#submitted').textContent='Manually submitted';};</script></body></html>
